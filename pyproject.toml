[project]
name = "storybuilder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "braintrust>=0.25.0",
    "cartesia>=3.2.0",
    "chromadb>=1.5.9",
    "google-adk[a2a,all,db,eval]>=2.2.0",
    "google-cloud-aiplatform[adk,ag2,agent-engines]>=1.158.0",
    "google-cloud-storage>=3.12.0",
    "google-genai>=2.8.0",
    "ibm-watsonx-orchestrate>=2.11.0",
    "lsprotocol==2023.0.1",
    "matplotlib>=3.10.9",
    "openai>=2.41.0",
    "opentelemetry-distro>=0.63b1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "pandas>=2.3.3",
    "plotly>=6.8.0",
    "pygls==1.0.0",
    "pysocks>=1.7.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.5.1",
    "spacy[cuda12x]>=3.8.14",
    "streamlit>=1.58.0",
    "tqdm>=4.68.1",
    "transformers>=5.10.2",
    "xai-sdk>=1.15.0",
    "opentelemetry-instrumentation-asyncio==0.63b1",
    "opentelemetry-instrumentation-dbapi==0.63b1",
    "opentelemetry-instrumentation-logging==0.63b1",
    "opentelemetry-instrumentation-sqlite3==0.63b1",
    "opentelemetry-instrumentation-threading==0.63b1",
    "opentelemetry-instrumentation-urllib==0.63b1",
    "opentelemetry-instrumentation-wsgi==0.63b1",
    "opentelemetry-instrumentation-openai-v2",
    "opentelemetry-instrumentation-vertexai>=2.0b0",
    "opentelemetry-instrumentation-aiohttp-client==0.63b1",
    "opentelemetry-instrumentation-aiohttp-server==0.63b1",
    "opentelemetry-instrumentation-click==0.63b1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-grpc==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-instrumentation-jinja2==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-instrumentation-requests==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "opentelemetry-instrumentation-starlette==0.63b1",
    "opentelemetry-instrumentation-tortoiseorm==0.63b1",
    "opentelemetry-instrumentation-urllib3==0.63b1",
    "agent-framework>=1.0.0b251120",
    "twine>=6.2.0",
    "ruff>=0.15.20",
    "black>=26.5.1",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "nbqa>=1.9.1",
    "codecov>=2.1.13",
]

[project.scripts]
downloader = "storybuilder.downloader.cli:main"
genai-tts = "storybuilder.genai.tts:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
cupy = ["pkg_resources"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
project-excludes = [
    "**/.venv/**",
    "**/.env/**",
    "**/.venv/**",
    "**/__pyrefly_virtual__/**",
    "**/__pycache__/**",
    "**/*.pyc/**",
    "**/inmemory/**"
]

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = false
skip-magic-trailing-comma = false
force-exclude = """
/(
    | docs
    | setup.py
)/
"""

[tool.isort]
py_version = 312
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
default_section = "THIRDPARTY"
known_third_party = []
known_first_party = []
known_local_folder = []
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
lines_after_imports = 2
force_single_line = true
skip_glob = ["docs/*", "setup.py"]
filter_files = true

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
extend-exclude = ["docs", "test", "tests"]

[tool.ruff.lint]
select = ["F", "E"]
extend-select = ["ALL"]
ignore = ["D", "CPY", "T20", "DOC", "PGH"]
fixable = ["ALL"]
unfixable = []
    preview = true
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
      force-single-line = true
      force-sort-within-sections = false
      lines-after-imports = 2
known-first-party = []
known-local-folder = []
known-third-party = []
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.lint.mccabe]
      max-complexity = 24

[tool.ruff.lint.pycodestyle]
      ignore-overlong-task-comments = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
      allow-star-arg-any = false
      ignore-fully-untyped = false

[tool.ruff.lint.pylint]
      max-args = 5
      max-branches = 12
      max-locals = 15
      max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
    skip-magic-trailing-comma = false
line-ending = "auto"
    preview = false
    docstring-code-format = true

[dependency-groups]
dev = [
    "a>=1.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
