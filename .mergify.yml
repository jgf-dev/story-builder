queue_rules:
  - name: checks-pass
    merge_conditions:
      - "#check-failure = 0"
      - check-success = Run Tests
merge_queue:
  status_comments: all
  queue_controls_comment: true
  skip_intermediate_results: false
  reset_on_external_merge: always
  max_parallel_checks: 3
scopes:
  source:
    files:
      tests:
        include:
          - tests/**/*
      source:
        include:
          - src/**/*
      scripts:
        include:
          - scripts/**/*
pull_request_rules:
  - name: Fix conflicts
    conditions:
      - -draft
      - conflict
      - base = main
    actions:
      label:
        add:
          - "@jules"
      comment:
        message: "@jules can you fix the merge conflicts?"
  - name: Approve reviews automatically
    conditions:
      - -draft
      - review-requested = 1
      - changes-requested-reviews-by = jules
      - -conflict
    actions:
      review:
        message: Merge conflicts fixed
      queue:
        name: checks-pass
  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update: null
merge_protections_settings:
  auto_merge_conditions:
    - check-success ~= .*test.*
    - "#check-pending = 0"
    - "#deployment-failure = 0"
    - -conflict
    - "#check-timed-out = 0"
