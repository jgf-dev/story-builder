name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      downloader: ${{ steps.filter.outputs.downloader }}
      genai: ${{ steps.filter.outputs.genai }}
      analysis: ${{ steps.filter.outputs.analysis }}
      agents: ${{ steps.filter.outputs.agents }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            downloader:
              - 'src/storybuilder/downloader/**'
              - 'scripts/import_to_sqlite.py'
              - 'scripts/story_db.py'
              - 'scripts/dashboard.py'
              - 'tests/test_downloader.py'
              - 'tests/test_database.py'
              - 'tests/test_dashboard.py'
            genai:
              - 'src/storybuilder/genai/**'
              - 'src/storybuilder/agents/cartesia_tts_prompt_crafter/**'
              - '.agent/skills/tts-prompt-crafter/**'
              - 'tests/test_genai.py'
              - 'tests/test_cartesia.py'
              - 'tests/test_parse_speech_config.py'
              - 'tests/test_parse_speech_config_split.py'
              - 'tests/test_split_prompts.py'
            analysis:
              - 'src/storybuilder/analysis/**'
              - 'tests/test_analyze_sentiment.py'
              - 'tests/test_compare_narratives.py'
              - 'tests/test_find_similar.py'
              - 'tests/test_generate_diagrams.py'
              - 'tests/test_generate_embeddings.py'
              - 'tests/test_visualize_arcs.py'
            agents:
              - 'src/storybuilder/agents/**'
              - 'tests/test_agent_smoke.py'
              - 'tests/test_agent_tools.py'
              - 'tests/test_subagent.py'
            common:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/test.yml'
              - 'tests/test_keys.py'

  test-downloader:
    needs: changes
    if: needs.changes.outputs.downloader == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run Downloader Tests
        env:
          COVERAGE_FILE: .coverage.downloader
        run: uv run pytest --cov=src tests/test_downloader.py tests/test_database.py tests/test_dashboard.py
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-downloader
          path: .coverage.downloader
          include-hidden-files: true
          if-no-files-found: error

  test-genai:
    needs: changes
    if: needs.changes.outputs.genai == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run GenAI Tests
        env:
          COVERAGE_FILE: .coverage.genai
        run: uv run pytest --cov=src tests/test_genai.py tests/test_cartesia.py tests/test_parse_speech_config.py tests/test_parse_speech_config_split.py tests/test_split_prompts.py
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-genai
          path: .coverage.genai
          include-hidden-files: true
          if-no-files-found: error

  test-analysis:
    needs: changes
    if: needs.changes.outputs.analysis == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run Analysis Tests
        env:
          COVERAGE_FILE: .coverage.analysis
        run: uv run pytest --cov=src tests/test_analyze_sentiment.py tests/test_compare_narratives.py tests/test_find_similar.py tests/test_generate_diagrams.py tests/test_generate_embeddings.py tests/test_visualize_arcs.py
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-analysis
          path: .coverage.analysis
          include-hidden-files: true
          if-no-files-found: error

  test-agents:
    needs: changes
    if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run Agent Tests
        env:
          COVERAGE_FILE: .coverage.agents
        run: uv run pytest --cov=src tests/test_agent_smoke.py tests/test_agent_tools.py tests/test_subagent.py
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agents
          path: .coverage.agents
          include-hidden-files: true
          if-no-files-found: error

  test-misc:
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run Misc Tests
        env:
          COVERAGE_FILE: .coverage.misc
        run: uv run pytest --cov=src tests/test_keys.py
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-misc
          path: .coverage.misc
          include-hidden-files: true
          if-no-files-found: error

  test-results:
    needs:
      - test-downloader
      - test-genai
      - test-analysis
      - test-agents
      - test-misc
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify test jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "A required test job did not succeed: $r"
              exit 1
            fi
          done
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - name: Install uv
        if: github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        if: github.event_name == 'pull_request'
        run: uv sync --all-extras --dev
      - name: Download coverage data
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage
        if: github.event_name == 'pull_request'
        run: |
          uv run coverage combine .coverage.*
          uv run coverage xml -o coverage.xml
      - name: Post Coverage Comment
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
