name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    timeout-minutes: 5

    concurrency:
      group: pr-agent-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          GOOGLE_AI_STUDIO_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add fallback keys for quota rotation (optional but recommended)
          # GOOGLE_AI_STUDIO_GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          # GOOGLE_AI_STUDIO_GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          config.model: "gemini/gemini-1.5-pro"
          config.fallback_models: "gemini/gemini-1.5-flash"
