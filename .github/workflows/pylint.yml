name: Pylint
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
        
      - name: Install pylint
        run: |
          pip install pylint

      - name: Add pylint annotator
        uses: jpy-git/pylint-pr-annotator@master

      - name: Run pylint
        run: |
          pylint src/
