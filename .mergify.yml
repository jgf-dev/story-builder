queue_rules:
  - name: main-queue
    merge_conditions:
      - "#check-pending = 0"
      - "#check-failure = 0"
      - "#check-timed-out = 0"
      - "#deployment-failure = 0"
      - "#review-threads-unresolved = 0"
      - -conflict
    branch_protection_injection_mode: merge
    queue_conditions:
      - base = main
merge_queue:
  status_comments: all
  queue_controls_comment: true
  skip_intermediate_results: false
  reset_on_external_merge: always
  max_parallel_checks: 3
scopes:
  source:
    files:
      tests:
        include:
          - tests/**/*
      source:
        include:
          - src/**/*
      scripts:
        include:
          - scripts/**/*
merge_protections_settings:
  auto_merge_conditions: true
pull_request_rules:
  - name: Auto-merge approved PRs
    conditions:
      - base = main
      - "#review-threads-unresolved = 0"
      - "#changes-requested-reviews-by = 0"
      - "#check-failure = 0"
      - "#check-pending = 0"
      - "#deployment-failure = 0"
      - check-success ~= ^run_tests / test-results$
    actions:
      merge:
        method: squash
  - name: Fix conflicts
    conditions:
      - -draft
      - conflict
      - base = main
    actions:
      label:
        add:
          - "jules"
          - "failures"
      comment:
        message: "Can copilot or jules fix the merge conflicts?"
      review:
        type: REQUEST_CHANGES
        message: Can copilot or jules fix the merge conflicts?
  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update: null
  - name: No more failures
    conditions:
      - base = main
      - -conflict
      - label ~= failures
    actions:
      label:
        add: []
        remove:
          - failures
        toggle: []
      queue:
        name: main-queue
      update: null
      review: null
  - name: Draft to open
    conditions:
      - draft
      - head = main
    actions:
      edit:
        draft: false
  - name: Approve
    conditions:
      - base = main
      - "#review-requested >= 1"
      - "#check-failure = 0"
      - -conflict
      - "#deployment-failure = 0"
      - "#check-pending = 0"
    actions:
      review: null
