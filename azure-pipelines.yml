# Python package
# Create and test a Python package on Python 3.12 with uv.
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python312:
      python.version: '3.12'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: python -m pip install --upgrade pip uv
  displayName: 'Install uv'

- script: uv sync --dev
  displayName: 'Install dependencies'

- script: uv run python -m spacy download en_core_web_sm
  displayName: 'Download spaCy model'

- script: uv run python -m pytest
  displayName: 'pytest'
