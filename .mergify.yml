
queue_rules:
  - name: checks-pass
    merge_conditions:
      - "#check-failure = 0"
      - check-success = Run Tests
merge_queue:
  status_comments: all
  queue_controls_comment: true
  skip_intermediate_results: false
  reset_on_external_merge: always
  max_parallel_checks: 3

scopes:
  source:
    files:
      tests:
        include:
          - tests/**/*
      source:
        include:
          - src/**/*
      scripts:
        include:
          - scripts/**/*
pull_request_rules:
  - name: Request reviews automatically
    conditions:
      - base = main
      - "#check-failure = 0"
      - "#check-pending = 0"
      - "#deployment-failure = 0"
      - check-success ~= test
    actions:
      merge:
        method: squash
  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update: null
merge_protections_settings:
  auto_merge_conditions:
    - check-success ~= .*test.*
    - "#check-pending = 0"
    - "#deployment-failure = 0"
    - -conflict
    - "#check-timed-out = 0"
