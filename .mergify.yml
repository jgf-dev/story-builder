queue_rules:
  - name: main-queue
    merge_conditions:
      - "#check-pending = 0"
      - "#check-failure = 0"
      - "#check-timed-out = 0"
      - "#deployment-failure = 0"
      - "#review-threads-unresolved = 0"
      - -conflict
    branch_protection_injection_mode: merge
    queue_conditions:
      - base = main
merge_queue:
  status_comments: outcomes
  queue_controls_comment: true
  skip_intermediate_results: true
  reset_on_external_merge: never
  max_parallel_checks: 5
  mode: parallel
scopes:
  source:
    files:
      tests:
        include:
          - tests/**/*
      scripts:
        include:
          - scripts/**/*
      downloader:
        include:
          - "**/downloader/**"
      analysis:
        include:
          - "**/analysis/**"
      dashboard:
        include:
          - "**/dashboard/**"
          - "**/*.html"
      utils:
        include:
          - "**/utils/**"
      genai:
        include:
          - "**/genai/**"
      agents:
        include:
          - "**/agents/**"
          - .agents/**
      evals:
        include:
          - "**/evals/**"
      tasks:
        include:
          - tasks/**
      types:
        include:
          - typings/**
      ci:
        include:
          - .github/**
          - .circleci/**
          - "*.yaml"
          - "*.yml"
merge_protections_settings:
  auto_merge_conditions: true
pull_request_rules:
  - name: Auto-merge approved PRs
    conditions:
      - base = main
      - "#review-threads-unresolved = 0"
      - "#changes-requested-reviews-by = 0"
      - "#check-failure = 0"
      - "#check-pending = 0"
      - "#deployment-failure = 0"
      - check-success ~= ^run_tests / test-results$
    actions:
      merge:
        method: squash
  - name: Fix conflicts
    conditions:
      - -draft
      - conflict
      - base = main
    actions:
      label:
        add:
          - "@jules"
          - "@devin"
      comment:
        message: "@jules @devin can you fix the merge conflicts?"
  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update: null
  - name: New rule
    conditions:
      - base = main
      - -conflict
      - label ~= invalid
    actions:
      label:
        add: []
        remove:
          - invalid
        toggle: []
      queue:
        name: main-queue
