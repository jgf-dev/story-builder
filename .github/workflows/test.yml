name: run_tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      downloader: ${{ steps.filter.outputs.downloader }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      genai: ${{ steps.filter.outputs.genai }}
      analysis: ${{ steps.filter.outputs.analysis }}
      agents: ${{ steps.filter.outputs.agents }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            downloader:
              - 'src/storybuilder/downloader/**'
              - 'scripts/import_to_sqlite.py'
              - 'scripts/story_db.py'
              - 'tests/downloader/**'
            dashboard:
              - 'src/storybuilder/dashboard/**'
              - 'src/storybuilder/downloader/db.py'
              - 'src/storybuilder/downloader/__init__.py'
              - 'scripts/dashboard.py'
              - 'tests/dashboard/**'
            genai:
              - 'src/storybuilder/genai/**'
              - 'src/storybuilder/agents/cartesia_tts_prompt_crafter/**'
              - 'src/storybuilder/downloader/**'
              - '.agent/skills/tts-prompt-crafter/**'
              - 'tests/genai/**'
            analysis:
              - 'src/storybuilder/analysis/**'
              - 'tests/analysis/**'
            agents:
              - 'src/storybuilder/agents/**'
              - 'tests/agents/**'
            common:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/test.yml'
              - 'AGENTS.md'
              - 'tests/misc/**'

  test-downloader:
    needs: changes
    if: needs.changes.outputs.downloader == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev --prerelease=allow
      - name: Run Downloader Tests
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: uv run pytest --cov=src tests/downloader
      - name: Rename Coverage File
        if: github.event_name == 'pull_request'
        run: mv .coverage .coverage.downloader
      - name: Upload Coverage Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-downloader
          path: .coverage.downloader

  test-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev --prerelease=allow
      - name: Run Dashboard Tests
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: uv run pytest --cov=src tests/dashboard
      - name: Rename Coverage File
        if: github.event_name == 'pull_request'
        run: mv .coverage .coverage.dashboard
      - name: Upload Coverage Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dashboard
          path: .coverage.dashboard

  test-genai:
    needs: changes
    if: needs.changes.outputs.genai == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev --prerelease=allow
      - name: Run GenAI Tests
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: uv run pytest --cov=src tests/genai
      - name: Rename Coverage File
        if: github.event_name == 'pull_request'
        run: mv .coverage .coverage.genai
      - name: Upload Coverage Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-genai
          path: .coverage.genai

  test-analysis:
    needs: changes
    if: needs.changes.outputs.analysis == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev --prerelease=allow
      - name: Run Analysis Tests
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: uv run pytest --cov=src tests/analysis
      - name: Rename Coverage File
        if: github.event_name == 'pull_request'
        run: mv .coverage .coverage.analysis
      - name: Upload Coverage Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-analysis
          path: .coverage.analysis

  test-agents:
    needs: changes
    if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev --prerelease=allow
      - name: Run Agent Tests
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: uv run pytest --cov=src tests/agents
      - name: Rename Coverage File
        if: github.event_name == 'pull_request'
        run: mv .coverage .coverage.agents
      - name: Upload Coverage Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agents
          path: .coverage.agents

  test-misc:
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --all-extras --dev --prerelease=allow
      - name: Run Misc Tests
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: uv run pytest --cov=src tests/misc
      - name: Rename Coverage File
        if: github.event_name == 'pull_request'
        run: mv .coverage .coverage.misc
      - name: Upload Coverage Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-misc
          path: .coverage.misc

  test-results:
    needs:
      - test-downloader
      - test-dashboard
      - test-genai
      - test-analysis
      - test-agents
      - test-misc
    if: always()
    runs-on: Linux
    steps:
      - name: Verify test jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          all_skipped=true
          for r in $results; do
            if [ "$r" != "skipped" ]; then
              all_skipped=false
            fi
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "A required test job did not succeed: $r"
              exit 1
            fi
          done
          if [ "$all_skipped" = "true" ]; then
            echo "All test jobs were skipped; reporting success."
          fi

  post-coverage:
    needs:
      - test-downloader
      - test-dashboard
      - test-genai
      - test-analysis
      - test-agents
      - test-misc
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverages
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverages
        run: |
          uv run pytest --version # ensure virtualenv setup
          uv run pip install coverage
          shopt -s nullglob
          files=(coverages/.coverage.*)
          if [ ${#files[@]} -gt 0 ]; then
            uv run coverage combine "${files[@]}"
            uv run coverage xml -o coverage.xml
          else
            echo "No coverage files found."
          fi
      - name: Post Coverage Comment
        if: hashFiles('coverage.xml') != ''
        uses: orgoro/coverage@ca0c362dc1a4f100447309405e6dfea47e251495 # v3.3.1
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
